                document.body.appendChild(playingStateButtonDiv);
            }

            const noteDataset = Math.random() < 0.5 ? [data0m, data0b] : [data1m, data1b];
            const notesParam1 = document.createElement("textarea");
            {
                const notesParamDiv = document.createElement("div");
                notesParam1.style.width = "100%";
                notesParam1.style.boxSizing = "border-box";
                notesParam1.style.resize = "vertical";
                notesParam1.style.fontFamily = "monospace";
                notesParam1.style.height = "12rem";
                notesParam1.value = noteDataset[0];
                notesParamDiv.appendChild(notesParam1);
                document.body.appendChild(notesParamDiv);
            }

            const notesParam2 = document.createElement("textarea");
            {
                const notesParamDiv = document.createElement("div");
                notesParam2.style.width = "100%";
                notesParam2.style.boxSizing = "border-box";
                notesParam2.style.resize = "vertical";
                notesParam2.style.fontFamily = "monospace";
                notesParam2.style.height = "12rem";
                notesParam2.value = noteDataset[1];
                notesParamDiv.appendChild(notesParam2);
                document.body.appendChild(notesParamDiv);
            }

            const context = new AudioContext();
            context.suspend();
            const oscillatorNode1 = context.createOscillator();
            const noteGainNode1 = context.createGain();
            const oscillatorNode2 = context.createOscillator();
            const noteGainNode2 = context.createGain();
            const userGainNode = context.createGain();
            oscillatorNode1.type = "square";
            noteGainNode1.gain.value = 0;
            oscillatorNode2.type = "square";
            noteGainNode2.gain.value = 0;
            const updateGain = () => {
                userGainNode.gain.value = gainParam.value / (gainParam.max - gainParam.min) - gainParam.min;
            };
            gainParam.addEventListener("input", updateGain);
            updateGain();
            oscillatorNode1.connect(noteGainNode1);
            oscillatorNode2.connect(noteGainNode2);
            noteGainNode1.connect(userGainNode);
            noteGainNode2.connect(userGainNode);
            userGainNode.connect(context.destination);
            oscillatorNode1.start();
            oscillatorNode2.start();

            const previewCanvasContainer = document.createElement("div");
            previewCanvasContainer.style.overflowX = "scroll";
            let isDown = false;
            document.addEventListener("mousedown", e => {
                if (previewCanvasContainer === e.target || previewCanvasContainer.contains(e.target)) isDown = true;
            });
            document.addEventListener("mousemove", e => {
              if (isDown) previewCanvasContainer.scrollLeft -= e.movementX;
            });
            document.addEventListener("mouseup", () => {
              isDown = false;
            });
            document.body.appendChild(previewCanvasContainer);

            const previewCanvas1 = document.createElement("canvas");
            const previewCanvasContext1 = previewCanvas1.getContext("2d");
            {
                const previewCanvasDiv = document.createElement("div");
                previewCanvas1.width = 16;
                previewCanvas1.height = 9;
                previewCanvas1.style.maxHeight = "45svh";
                previewCanvas1.style.boxSizing = "border-box";
                previewCanvasDiv.appendChild(previewCanvas1);
                previewCanvasContainer.appendChild(previewCanvasDiv);
            }

            const previewCanvas2 = document.createElement("canvas");
            const previewCanvasContext2 = previewCanvas2.getContext("2d");
            {
                const previewCanvasDiv = document.createElement("div");
                previewCanvas2.width = 16;
                previewCanvas2.height = 9;
                previewCanvas2.style.maxHeight = "45svh";
                previewCanvas2.style.boxSizing = "border-box";
                previewCanvasDiv.appendChild(previewCanvas2);
                previewCanvasContainer.appendChild(previewCanvasDiv);
            }

            const gainWaveArray = new Float32Array(8);
            for (let i = 0; i < gainWaveArray.length; i++) gainWaveArray[i] = 1 / 3 + 2 * 3 ** -(1 + i / 4);
            startButton.addEventListener("click", () => {
                const pitchAdjust =  pitchParam.value - 6;
                const notes1 = notesParam1.value.trim().split(/(?:\r|\n|\u0020)+/g).map(v => parseNote(v, pitchAdjust));
                if (!notes1.every(v => v)) {
                    throw new Error("invalid input");
                }
                const notes2 = notesParam2.value.trim().split(/(?:\r|\n|\u0020)+/g).map(v => parseNote(v, pitchAdjust));
                if (!notes2.every(v => v)) {
                    throw new Error("invalid input");
                }
                const ticksum1 = notes1.reduce((a, b) => a + b.length, 0);
                previewCanvas1.width = 16 * ticksum1;
                previewCanvas1.height = 1152;
                const ticksum2 = notes2.reduce((a, b) => a + b.length, 0);
                previewCanvas2.width = 16 * ticksum2;
                previewCanvas2.height = 1152;
                oscillatorNode1.frequency.cancelScheduledValues(context.currentTime);
                noteGainNode1.gain.cancelScheduledValues(context.currentTime);
                oscillatorNode2.frequency.cancelScheduledValues(context.currentTime);
                noteGainNode2.gain.cancelScheduledValues(context.currentTime);
                resetCanvas(previewCanvasContext1, 88, ticksum1, 12, 1, 16, 0);
                resetCanvas(previewCanvasContext2, 88, ticksum2, 12, 1, 16, 0);
                const time = context.currentTime;
                const noteLengthValue = noteLength.value / 400;
                {
                    let tick = 0;
                    for (const note of notes1) {
                        const f = note.freq;
                        previewCanvasContext1.fillStyle = noteColors[note.num % noteColors.length];
                        previewCanvasContext1.fillRect(
                            tick / ticksum1 * previewCanvas1.width + 1,
                            (87 - note.num) / 88 * previewCanvas1.height,
                            note.length * previewCanvas1.width / ticksum1 - 2,
                            previewCanvas1.height / 88
                        );
                        oscillatorNode1.frequency.setValueAtTime(f, time + tick * noteLengthValue);
                        for (let j = 0; j < gainWaveArray.length; j++) {
                            noteGainNode1.gain.setValueAtTime(gainWaveArray[j], time + tick * noteLengthValue + j / gainWaveArray.length * (noteLengthValue - 0.0001));
                        }
                        tick += note.length;
                    }
                    noteGainNode1.gain.setValueAtTime(0, time + tick * noteLengthValue);
                }
                {
                    let tick = 0;
                    for (const note of notes2) {
                        const f = note.freq;
                        previewCanvasContext2.fillStyle = noteColors[note.num % noteColors.length];
                        previewCanvasContext2.fillRect(
                            tick / ticksum2 * previewCanvas2.width + 1,
                            (87 - note.num) / 88 * previewCanvas2.height,
                            note.length * previewCanvas2.width / ticksum2 - 2,
                            previewCanvas2.height / 88
                        );
                        oscillatorNode2.frequency.setValueAtTime(f, time + tick * noteLengthValue);
                        for (let j = 0; j < gainWaveArray.length; j++) {
                            noteGainNode2.gain.setValueAtTime(gainWaveArray[j], time + tick * noteLengthValue + j / gainWaveArray.length * (noteLengthValue - 0.0001));
                        }
                        tick += note.length;
                    }
                    noteGainNode2.gain.setValueAtTime(0, time + tick * noteLengthValue);
                }
                updateGain();
                context.resume();
            });
        </script>
    </body>
</html>
